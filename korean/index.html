<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Learning Hub – ParkXLab</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-wrap {
            margin-bottom: 16px;
        }

        .logo-wrap img {
            height: 100px;
            width: auto;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* Nav cards */
        .nav-wrap {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .nav-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 22px;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .nav-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99,102,241,0.12);
        }

        .nav-card.coming-soon {
            opacity: 0.55;
            cursor: default;
            pointer-events: none;
        }

        .icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .icon-purple { background: #ede9fe; }
        .icon-red    { background: #fee2e2; }
        .icon-teal   { background: #d1fae5; }
        .icon-amber  { background: #fef3c7; }

        .nav-text { flex: 1; }

        .nav-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .nav-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            background: #fef3c7;
            color: #92400e;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid #fde68a;
            white-space: nowrap;
        }

        .arrow {
            font-size: 1.1rem;
            color: #cbd5e1;
        }

        /* Footer */
        .footer {
            margin-top: 36px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-wrap">
            <a href="https://www.parkxlab.com" target="_blank" rel="noopener noreferrer">
                <img src="https://raw.githubusercontent.com/parkxlab/parkxlab.github.io/main/images/parkxlab_logo_Korea.png" alt="ParkXLab Logo">
            </a>
        </div>
        <h1>Korean Learning Hub 🇰🇷</h1>
        <p>Pronunciation, vocabulary, and more!</p>
    </div>

    <nav class="nav-wrap" aria-label="Korean learning links">

        <a class="nav-card" href="https://www.parkxlab.com/koreanquiz/" target="_blank" rel="noopener noreferrer">
            <div class="icon-wrap icon-purple">🎮</div>
            <div class="nav-text">
                <div class="nav-title">퀴즈 (Quiz)</div>
                <div class="nav-desc">Pronunciation & vocabulary practice</div>
            </div>
            <span class="arrow">›</span>
        </a>

        <a class="nav-card" href="https://youtube.com/playlist?list=PLaBzg96yMjUcbqS6QflB4kUFcKQ0oWBJN&si=E_eBCLOioQ_E2ePK" target="_blank" rel="noopener noreferrer">
            <div class="icon-wrap icon-red">📺</div>
            <div class="nav-text">
                <div class="nav-title">유튜브 (YouTube)</div>
                <div class="nav-desc">Video lessons & tutorials</div>
            </div>
            <span class="arrow">›</span>
        </a>

        <a class="nav-card coming-soon" href="#" aria-disabled="true">
            <div class="icon-wrap icon-teal">📁</div>
            <div class="nav-text">
                <div class="nav-title">자료실 (Resources)</div>
                <div class="nav-desc">Worksheets, PDFs & study materials</div>
            </div>
            <span class="badge">Coming Soon</span>
        </a>

        <a class="nav-card" href="mailto:parkxlab@gmail.com">
            <div class="icon-wrap icon-amber">✉️</div>
            <div class="nav-text">
                <div class="nav-title">문의 (Contact)</div>
                <div class="nav-desc">Send us an email</div>
            </div>
            <span class="arrow">›</span>
        </a>

    </nav>

    <div class="footer">
        <a href="https://www.parkxlab.com" target="_blank" rel="noopener noreferrer">parkxlab.com</a>
    </div>

</body>
</html>
