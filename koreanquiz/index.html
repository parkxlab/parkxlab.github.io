<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Pronunciation Practice</title>
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5;
            --bg-color: #f8fafc; --card-bg: #ffffff;
            --text-main: #1e293b; --text-muted: #64748b;
            --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container {
            background: var(--card-bg); max-width: 480px; width: 100%;
            border-radius: 20px; padding: 40px 30px; text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        p.subtitle { color: var(--text-muted); margin-bottom: 30px; }
        .hidden { display: none !important; }

        .menu-btn {
            display: block; width: 100%; padding: 16px; margin-bottom: 15px;
            background-color: #f1f5f9; border: 2px solid transparent; border-radius: 12px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .menu-btn:hover { background-color: #e2e8f0; border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }

        .stage-title { font-size: 1.2rem; color: var(--primary); font-weight: bold; margin-bottom: 20px; }
        .word-display { font-size: 4rem; font-weight: 700; margin: 20px 0 10px 0; }
        .meaning-display {
            font-size: 1.2rem; color: var(--text-muted); margin-bottom: 25px;
            background-color: #f1f5f9; display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: 500;
        }

        .options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-btn {
            background-color: #ffffff; border: 2px solid #e2e8f0; border-radius: 12px;
            padding: 15px; font-size: 1.2rem; cursor: pointer; transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: #eff6ff; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .option-btn.correct { background-color: #dcfce7; border-color: var(--success); color: #166534; font-weight: bold; }
        .option-btn.wrong { background-color: #fee2e2; border-color: var(--danger); color: #991b1b; }

        .feedback-area { min-height: 30px; margin-bottom: 10px; font-size: 1.2rem; font-weight: 600; }
        .feedback-correct { color: var(--success); }
        .feedback-wrong { color: var(--danger); }
        
        .explanation-box {
            background-color: #fffbeb; border-left: 4px solid var(--warning);
            padding: 12px; text-align: left; margin-bottom: 20px; border-radius: 4px 8px 8px 4px;
            font-size: 0.95rem; color: #92400e; font-weight: 500;
        }

        .action-btn {
            background-color: var(--primary); color: white; border: none; border-radius: 10px;
            padding: 14px 24px; font-size: 1.1rem; font-weight: 600; cursor: pointer; width: 100%;
        }
        .action-btn:hover { background-color: var(--primary-hover); }
        .score-display { font-size: 3.5rem; font-weight: bold; color: var(--primary); margin: 20px 0; }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div id="menu-screen">
            <h1>Korean Pronunciation</h1>
            <p class="subtitle">Practice randomly selected questions!</p>
            <button class="menu-btn" onclick="startStage(1)">Stage 1: Basic Syllables</button>
            <button class="menu-btn" onclick="startStage(2)">Stage 2: Complex Syllables</button>
            <button class="menu-btn" onclick="startStage(3)">Stage 3: Basic Words</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="stage-title" id="stage-title">Stage 1</div>
            <p class="subtitle" id="progress-text">Question 1 / 10</p>
            
            <div class="word-display" id="question-word">가</div>
            <div class="meaning-display hidden" id="word-meaning">Meaning</div>
            
            <div class="options-grid" id="options-container"></div>
            
            <div class="feedback-area" id="feedback"></div>
            <div class="explanation-box hidden" id="explanation">💡 Tip: ㄱ(g) + ㅏ(a)</div>
            
            <button class="action-btn hidden" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="hidden">
            <h1>Stage Completed!</h1>
            <div class="score-display" id="final-score">0 / 10</div>
            <p id="result-message" style="margin-bottom: 30px; font-weight: 600;"></p>
            <button class="action-btn" onclick="showMenu()">Back to Main Menu</button>
        </div>
    </div>

        const quizData = { 1: [], 2: [], 3: [] };
        for (let stage in rawData) {
            quizData[stage] = rawData[stage].map(item => ({
                word: item[0], answer: item[1],
                options: [item[1], item[2], item[3]], 
                exp: item[4], meaning: item[5] || ""
            }));
        }

        let currentStage = 1;
        let currentQuestionIndex = 0;
        let score = 0;
        let activeQuestions = [];

        const menuScreen = document.getElementById('menu-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const optionsContainer = document.getElementById('options-container');
        const feedbackEl = document.getElementById('feedback');
        const expEl = document.getElementById('explanation');
        const nextBtn = document.getElementById('next-btn');

        function showMenu() {
            menuScreen.classList.remove('hidden'); quizScreen.classList.add('hidden'); resultScreen.classList.add('hidden');
        }

        function startStage(stage) {
            currentStage = stage; currentQuestionIndex = 0; score = 0;
            
            // 핵심: 100개의 데이터 중 배열을 무작위로 섞은 뒤(Shuffle), 설정한 갯수(10개)만 잘라냄
            const shuffledPool = [...quizData[stage]].sort(() => Math.random() - 0.5);
            activeQuestions = shuffledPool.slice(0, QUESTIONS_PER_ROUND);
            
            document.getElementById('stage-title').innerText = `Stage ${stage}`;
            menuScreen.classList.add('hidden'); quizScreen.classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            feedbackEl.innerText = ""; expEl.classList.add('hidden');
            nextBtn.classList.add('hidden'); optionsContainer.innerHTML = "";

            const q = activeQuestions[currentQuestionIndex];
            document.getElementById('progress-text').innerText = `Question ${currentQuestionIndex + 1} / ${activeQuestions.length}`;
            document.getElementById('question-word').innerText = q.word;

            const meaningEl = document.getElementById('word-meaning');
            if (q.meaning) { meaningEl.innerText = `Meaning: ${q.meaning}`; meaningEl.classList.remove('hidden'); } 
            else { meaningEl.classList.add('hidden'); }

            // 보기 섞기
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(clickedBtn, selectedWord, q) {
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                if(btn.innerText === q.answer) btn.classList.add('correct');
            });

            if (selectedWord === q.answer) {
                feedbackEl.innerText = "✨ Correct!"; feedbackEl.className = "feedback-area feedback-correct";
                score++;
            } else {
                clickedBtn.classList.add('wrong');
                feedbackEl.innerText = `❌ Wrong! (Answer: ${q.answer})`; feedbackEl.className = "feedback-area feedback-wrong";
                // 틀렸을 때 설명 박스 띄우기
                expEl.innerText = `💡 Tip: ${q.exp}`;
                expEl.classList.remove('hidden');
            }
            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) loadQuestion();
            else showResults();
        }

        function showResults() {
            quizScreen.classList.add('hidden'); resultScreen.classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / ${activeQuestions.length}`;
        }
